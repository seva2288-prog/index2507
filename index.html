<html lang="ru">

    <meta charset="UTF-8">

    <title>Футбол-Апп PRO — ОЗ</title>

            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e0e0e0;
            max-width: 480px;
            margin: 0 auto;
            padding: 12px 14px 80px 14px;
            min-height: 100vh;
        }
        body.light {
            background: #f0f2f5;
            color: #1a1a1a;
        }
        body.light input,
        body.light select,
        body.light .card {
            background: #ffffff !important;
            color: #1a1a1a !important;
            border-color: #d0d5dd !important;
        }
        body.light .history-item {
            background: #ffffff !important;
        }
        body.light .stats-card {
            background: #ffffff !important;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
        }
        .header h1 {
            font-size: 18px;
            color: #f7931a;
        }
        .header .version {
            font-size: 9px;
            color: #555;
        }
        .header-actions button {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        .card {
            background: #1a1f2a;
            border: 1px solid #2a3140;
            border-radius: 12px;
            padding: 10px 12px;
            margin: 4px 0;
        }
        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: #f7931a;
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #2a3140;
            background: #0b0e14;
            color: #e0e0e0;
            font-size: 13px;
            outline: none;
        }
        select:focus {
            border-color: #f7931a;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin: 4px 0;
        }
        .input-row .field {
            flex: 1;
        }
        .input-row .field label {
            font-size: 10px;
            color: #888;
            display: block;
        }
        .input-row .field input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2a3140;
            background: #0b0e14;
            color: #e0e0e0;
            text-align: center;
            font-size: 18px;
            outline: none;
        }
        .input-row .field input:focus {
            border-color: #f7931a;
        }

        .total-display {
            background: #1a1f2a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin: 4px 0;
            border: 1px solid #2a3140;
        }
        .total-display .value {
            font-size: 24px;
            font-weight: 700;
            color: #f7931a;
        }
        .total-display .label {
            font-size: 10px;
            color: #888;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin: 4px 0;
            transition: 0.15s;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-calc {
            background: #f7931a;
            color: #000;
        }
        .btn-save {
            background: #f7931a;
            color: #000;
            flex: 2;
        }
        .btn-clear {
            background: #3a1a1a;
            color: #ff8a8a;
            flex: 1;
        }
        .action-row {
            display: flex;
            gap: 8px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            text-align: center;
        }
        .result-grid .label {
            font-size: 9px;
            color: #888;
        }
        .result-grid .value {
            font-size: 20px;
            font-weight: 700;
            color: #f7931a;
        }
        .advice {
            margin-top: 4px;
            padding: 8px 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            border-left: 4px solid #2ecc71;
        }
        .advice.info {
            background: #1a2a3a;
            border-left-color: #f7931a;
            color: #f7931a;
        }
        .advice.good {
            background: #1a3a1a;
            border-left-color: #2ecc71;
            color: #2ecc71;
        }
        .advice.warn {
            background: #2a2a1a;
            border-left-color: #f1c40f;
            color: #f1c40f;
        }
        .advice.bad {
            background: #2a1a1a;
            border-left-color: #e74c3c;
            color: #e74c3c;
        }

        .confidence-bar {
            background: #1a1f2a;
            border-radius: 6px;
            height: 6px;
            margin: 4px 0;
            overflow: hidden;
        }
        .confidence-bar .fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s;
            background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71);
        }

        .bk-row {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #1a1f2a;
            padding: 6px 10px;
            border-radius: 10px;
            margin: 4px 0;
        }
        .bk-row label {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }
        .bk-row input {
            flex: 1;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #2a3140;
            background: #0b0e14;
            color: #e0e0e0;
            text-align: center;
            font-size: 14px;
            outline: none;
        }
        .bk-row input:focus {
            border-color: #f7931a;
        }

        .history-item {
            background: #1a1f2a;
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin: 2px 0;
            cursor: pointer;
            transition: 0.15s;
        }
        .history-item:active {
            transform: scale(0.98);
        }
        .history-item .win {
            color: #2ecc71;
        }
        .history-item .loss {
            color: #e74c3c;
        }
        .history-item .pending {
            color: #f1c40f;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .stats-card {
            background: #1a1f2a;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .stats-card .num {
            font-size: 20px;
            font-weight: 700;
            color: #f7931a;
        }
        .stats-card .label {
            font-size: 9px;
            color: #888;
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 30px;
        }
        .chart-bars .bar {
            flex: 1;
            min-width: 3px;
            border-radius: 2px 2px 0 0;
            background: #f7931a;
        }
        .chart-bars .bar.loss {
            background: #e74c3c;
        }

        .text-muted {
            color: #555;
        }
        .text-center {
            text-align: center;
        }
        .mt-1 {
            margin-top: 4px;
        }
        .flex {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            z-index: 999;
            background: #1a2a3a;
            color: #f7931a;
            border: 1px solid #f7931a;
            animation: slideUp 0.3s;
            max-width: 90%;
            text-align: center;
        }
        .toast.success {
            background: #1a3a1a;
            color: #2ecc71;
            border-color: #2ecc71;
        }
        .toast.error {
            background: #3a1a1a;
            color: #e74c3c;
            border-color: #e74c3c;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (max-width: 420px) {
            .input-row {
                flex-direction: column;
            }
        }

    <div class="header">

            <div class="field"><label>✈️ Гости</label><input type="number" id="awayGoals" value="0" min="0" /></div>
        </div>
    </div>

    <div class="total-display">
        <div class="label">📈 Сумма голов</div>
        <div class="value" id="sumDisplay">0</div>
    </div>

    <!-- КНОПКИ -->
    <button class="btn btn-calc" onclick="calculate()">⚡ Рассчитать</button>

    <div class="action-row">
        <button class="btn btn-save" onclick="saveBet()">💾 Записать</button>
        <button class="btn btn-clear" onclick="clearAll()">🗑️ Очистить</button>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div class="card">
        <div class="result-grid">
            <div><div class="label">Обе забьют</div><div class="value" id="resValue1">--</div></div>
            <div><div class="label">Вероятность</div><div class="value" id="resValue2">--</div></div>
            <div><div class="label">Линия БК</div><div class="value" id="resValue3">--</div></div>
        </div>
        <div class="advice info" id="resAdvice">⏳ Введите данные для расчёта</div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#888;margin-top:4px;">
            <span>📊 Индекс доверия</span>
            <span id="confidenceLabel">0%</span>
        </div>
        <div class="confidence-bar"><div class="fill" id="confidenceFill" style="width:0%"></div></div>
    </div>

    <!-- ЛИНИЯ БК -->
    <div class="bk-row">
        <label>📈 Линия БК (ОЗ):</label>
        <input type="number" id="bkLine" value="0" step="0.05" />
        <span id="bkComment" style="font-size:12px;font-weight:600;padding:2px 10px;border-radius:12px;">—</span>
    </div>

    <!-- НАЗВАНИЯ КОМАНД -->
    <div class="input-row">
        <div class="field"><label>🏠 Хозяева</label><input type="text" id="homeName" placeholder="Реал Мадрид" /></div>
        <div class="field"><label>✈️ Гости</label><input type="text" id="awayName" placeholder="Барселона" /></div>
    </div>

    <!-- ИСТОРИЯ -->
    <div style="margin-top:6px;">
        <div style="display:flex;justify-content:space-between;margin:4px 0;">
            <span style="font-size:14px;font-weight:700;color:#f7931a;">📜 История</span>
            <button onclick="clearHistory()" style="background:#5a1a1a;color:#ff8a8a;border:none;padding:2px 10px;border-radius:12px;font-size:10px;cursor:pointer;">🗑️</button>
        </div>
        <div id="historyList"><div class="text-muted text-center" style="padding:10px 0;">Нет ставок</div></div>
    </div>

    <!-- СТАТИСТИКА -->
    <div style="margin-top:6px;">
        <div style="font-size:14px;font-weight:700;color:#f7931a;margin-bottom:4px;">📊 Статистика</div>
        <div class="stats-grid" id="statsGrid">
            <div class="stats-card"><div class="num" id="statTotal">0</div><div class="label">Всего</div></div>
            <div class="stats-card"><div class="num" id="statWinRate">0%</div><div class="label">% побед</div></div>
            <div class="stats-card"><div class="num" id="statBalance">0</div><div class="label">Баланс</div></div>
            <div class="stats-card"><div class="num" id="statROI">0%</div><div class="label">ROI</div></div>
        </div>
    </div>

    <!-- ГРАФИК -->

        <div class="card-title">📈 График баланса (последние 20)</div>
        <div class="chart-bars" id="chartBars"></div>
    </div>

        let state = {
            bets: JSON.parse(localStorage.getItem('oz_bets') || '[]'),
            currentLeague: 'premier'
        };

        // ===== ВСПОМОГАТЕЛЬНЫЕ =====
        function $(id) { return document.getElementById(id); }

        function safeNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

        function showToast(msg, type = 'info') {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { if (t.parentNode) t.remove(); }, 2500);
        }

        function getLeague() {
            return ALL_LEAGUES[state.currentLeague] || ALL_LEAGUES['premier'];
        }

        // ===== РЕНДЕР ЛИГ =====
        function renderLeagues() {
            const select = $('leagueSelect');
            const groups = {};
            Object.keys(ALL_LEAGUES).forEach(key => {
                const league = ALL_LEAGUES[key];
                const firstChar = league.name.charAt(0);
                if (!groups[firstChar]) groups[firstChar] = [];
                groups[firstChar].push({ key, name: league.name });
            });

            select.innerHTML = '';
            const sortedGroups = Object.keys(groups).sort();
            sortedGroups.forEach(group => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = group;
                groups[group].sort((a, b) => a.name.localeCompare(b.name)).forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.key;
                    option.textContent = item.name;
                    if (item.key === state.currentLeague) option.selected = true;
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            });
        }

        // ===== РАСЧЕТ =====
        function calculate() {
            const home = safeNum($('homeGoals').value);
            const away = safeNum($('awayGoals').value);
            const total = home + away;

            if (total === 0) {
                showToast('⚠️ Введите голы!', 'error');
                return;
            }

            const league = getLeague();
            const both = home > 0 && away > 0;
            let prob = both ? 75 : 25;
            prob = (prob + (league.oz || 60)) / 2;

            if (total > 2) prob += 10;
            if (total < 1) prob -= 20;
            if (total === 0) prob = 5;

            prob = Math.min(100, Math.max(0, Math.round(prob)));

            const bkLine = safeNum($('bkLine').value);
            const hasBk = bkLine !== 0;

            $('resValue1').textContent = both ? '✅ Да' : '❌ Нет';
            $('resValue2').textContent = prob + '%';
            $('resValue3').textContent = hasBk ? bkLine : '--';

            // Индекс доверия
            let confidence = prob;
            if (hasBk && ((both && bkLine > 0.5) || (!both && bkLine < 0.5))) confidence += 10;
            confidence = Math.min(100, Math.max(0, Math.round(confidence)));

            $('confidenceLabel').textContent = confidence + '%';
            $('confidenceFill').style.width = confidence + '%';
            const fill = $('confidenceFill');
            if (confidence > 70) fill.style.background = 'linear-gradient(90deg, #2ecc71, #27ae60)';
            else if (confidence > 40) fill.style.background = 'linear-gradient(90deg, #f1c40f, #f39c12)';
            else fill.style.background = 'linear-gradient(90deg, #e74c3c, #c0392b)';

            // Совет
            const advice = $('resAdvice');
            if (prob > 70) {
                advice.textContent = `✅ Высокая вероятность ${prob}% — ОЗ`;
                advice.className = 'advice good';
            } else if (prob > 40) {
                advice.textContent = `🟡 Средняя вероятность ${prob}%`;
                advice.className = 'advice warn';
            } else {
                advice.textContent = `🔴 Низкая вероятность ${prob}% — НЗ`;
                advice.className = 'advice bad';
            }

            // Сравнение с БК
            if (hasBk) {
                const bkProb = bkLine > 0.5 ? 'ОЗ' : 'НЗ';
                advice.textContent += ` | БК: ${bkProb}`;
            }

            $('sumDisplay').textContent = total;

            renderHistory();
            renderStats();
            renderChart();
            renderInsights();
        }

        // ===== СОХРАНИТЬ СТАВКУ =====
        function saveBet() {
            const home = safeNum($('homeGoals').value);
            const away = safeNum($('awayGoals').value);
            const total = home + away;

            if (total === 0) {
                showToast('⚠️ Введите голы!', 'error');
                return;
            }

            const both = home > 0 && away > 0;
            const match = `${$('homeName').value || 'Хозяева'} - ${$('awayName').value || 'Гости'}`;
            const bkLine = safeNum($('bkLine').value);
            const confidence = parseInt($('confidenceLabel').textContent) || 50;

            const bet = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                match: match,
                home: home,
                away: away,
                oz: both,
                bkLine: bkLine,
                confidence: confidence,
                outcome: 'pending',
                resultText: '⏳ Ожидание'
            };

            state.bets.push(bet);
            localStorage.setItem('oz_bets', JSON.stringify(state.bets));

            renderHistory();
            renderStats();
            renderChart();
            renderInsights();
            showToast('✅ Ставка сохранена!', 'success');
        }

        // ===== ИСТОРИЯ =====
        function renderHistory() {
            const list = $('historyList');
            if (state.bets.length === 0) {
                list.innerHTML = '<div class="text-muted text-center" style="padding:10px 0;">Нет ставок</div>';
                return;
            }
            list.innerHTML = state.bets.slice().reverse().map((b, i) => {
                const idx = state.bets.length - 1 - i;
                const cls = b.outcome === 'win' ? 'win' : b.outcome === 'loss' ? 'loss' : 'pending';
                const emoji = b.outcome === 'win' ? '✅' : b.outcome === 'loss' ? '❌' : '⏳';
                const ozText = b.oz ? '✅ Да' : '❌ Нет';
                return `<div class="history-item" onclick="editBet(${idx})">
                    <div><b>${b.match}</b>: ${ozText}</div>
                    <div><span class="${cls}">${emoji} ${b.resultText || '⏳'}</span></div>
                </div>`;
            }).join('');
        }

        // ===== СТАТИСТИКА =====
        function renderStats() {
            const total = state.bets.length;
            const wins = state.bets.filter(b => b.outcome === 'win').length;
            const losses = state.bets.filter(b => b.outcome === 'loss').length;
            const winRate = (wins + losses) > 0 ? Math.round((wins / (wins + losses)) * 100) : 0;
            const balance = wins - losses;

            $('statTotal').textContent = total;
            $('statWinRate').textContent = (wins + losses) > 0 ? winRate + '%' : '0%';
            $('statBalance').textContent = balance;
            $('statROI').textContent = total > 0 ? Math.round((balance / total) * 100) + '%' : '0%';
        }

        // ===== ГРАФИК =====
        function renderChart() {
            const chart = $('chartBars');
            const last20 = state.bets.slice(-20);
            let bal = 0;
            const data = [];
            last20.forEach(b => {
                if (b.outcome === 'win') bal++;
                else if (b.outcome === 'loss') bal--;
                data.push(bal);
            });
            if (data.length === 0) {
                chart.innerHTML = '<span style="color:#888;font-size:11px;">Нет данных</span>';
                return;
            }
            const max = Math.max(1, ...data.map(Math.abs));
            chart.innerHTML = data.map(v => {
                const h = Math.max(3, (Math.abs(v) / max) * 26);
                return `<div class="bar ${v < 0 ? 'loss' : ''}" style="height:${h}px;"></div>`;
            }).join('');
        }

        // ===== ВЫВОДЫ =====
        function renderInsights() {
            const container = $('insightsContent');
            const total = state.bets.length;
            if (total === 0) {
                container.innerHTML = '<div class="text-muted text-center" style="padding:6px 0;">Нет данных</div>';
                return;
            }
            const wins = state.bets.filter(b => b.outcome === 'win').length;
            const rate = Math.round((wins / total) * 100);
            let text = `📊 Всего ставок: ${total}, побед: ${wins} (${rate}%)`;
            if (rate >= 60) text = '🔥 ' + text;
            else if (rate < 40 && total >= 3) text = '⚠️ ' + text;

            const ozWins = state.bets.filter(b => b.oz === true && b.outcome === 'win').length;
            const ozTotal = state.bets.filter(b => b.oz === true).length;
            if (ozTotal >= 3) {
                const ozRate = Math.round((ozWins / ozTotal) * 100);
                text += `<br>⚽ ОЗ: ${ozRate}% (${ozWins}/${ozTotal})`;
            }

            container.innerHTML = `<div style="font-size:12px;padding:2px 0;">${text}</div>`;
        }

        // ===== РЕДАКТИРОВАНИЕ =====
        function editBet(index) {
            const b = state.bets[index];
            const newOutcome = prompt(`Исход для ${b.match}:\n1 - Выиграла\n2 - Проиграла\n3 - Неизвестно`, '3');
            if (newOutcome === null) return;
            if (newOutcome === '1') { b.outcome = 'win';
                b.resultText = '✅ Выигрыш'; } else if (newOutcome === '2') { b.outcome = 'loss';
                b.resultText = '❌ Проигрыш'; } else { b.outcome = 'pending';
                b.resultText = '⏳ Ожидание'; }
            localStorage.setItem('oz_bets', JSON.stringify(state.bets));
            renderHistory();
            renderStats();
            renderChart();
            renderInsights();
            showToast('✅ Обновлено', 'success');
        }

        // ===== ОЧИСТКА =====
        function clearAll() {
            $('homeGoals').value = '0';
            $('awayGoals').value = '0';
            $('bkLine').value = '0';
            $('sumDisplay').textContent = '0';
            $('resValue1').textContent = '--';
            $('resValue2').textContent = '--';
            $('resValue3').textContent = '--';
            $('resAdvice').textContent = '⏳ Введите данные для расчёта';
            $('resAdvice').className = 'advice info';
            $('confidenceLabel').textContent = '0%';
            $('confidenceFill').style.width = '0%';
            showToast('🗑️ Очищено', 'info');
        }

        function clearHistory() {
            if (!confirm('Удалить всю историю?')) return;
            state.bets = [];
            localStorage.setItem('oz_bets', JSON.stringify(state.bets));
            renderHistory();
            renderStats();
            renderChart();
            renderInsights();
            showToast('🗑️ История очищена', 'success');
        }

        function resetAll() {
            if (!confirm('Сбросить все данные?')) return;
            localStorage.clear();
            location.reload();
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            document.querySelector('.header-actions button:first-child').textContent =
                document.body.classList.contains('light') ? '☀️' : '🌙';
        }

        // ===== СОБЫТИЯ =====
        $('leagueSelect').onchange = function() {
            state.currentLeague = this.value;
            if (safeNum($('homeGoals').value) > 0 || safeNum($('awayGoals').value) > 0) {
                calculate();
            }
        };

        $('homeGoals').oninput = function() {
            const total = safeNum(this.value) + safeNum($('awayGoals').value);
            $('sumDisplay').textContent = total;
            if (total > 0) calculate();
        };

        $('awayGoals').oninput = function() {
            const total = safeNum($('homeGoals').value) + safeNum(this.value);
            $('sumDisplay').textContent = total;
            if (total > 0) calculate();
        };

        $('bkLine').oninput = function() {
            if (safeNum($('homeGoals').value) > 0 || safeNum($('awayGoals').value) > 0) {
                calculate();
            }
        };

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        renderLeagues();
        renderHistory();
        renderStats();
        renderChart();
        renderInsights();

        console.log('⚽ ОЗ-Апп PRO — РАБОТАЕТ!');
        console.log('🌍 Всего лиг: ' + Object.keys(ALL_LEAGUES).length);
        console.log('✅ Введите голы и нажмите "Рассчитать"');
    </script>

</body>
</html>
