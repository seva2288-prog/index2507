<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Квантум — тест API</title>
</head>
<body>
    <h1>⚛️ Квантум — тест</h1>
    <input type="text" id="team" value="Arsenal" placeholder="Введите команду">
    <button onclick="testAPI()">🔍 Найти команду</button>
    <pre id="result">Нажмите кнопку</pre>

    <script>
    // НОВЫЙ API-КЛЮЧ (с вашего скриншота)
    const API_KEY = '95dfb0a1c033543b52508b87376cc67b';

    async function testAPI() {
        const team = document.getElementById('team').value.trim();
        const result = document.getElementById('result');
        result.textContent = '⏳ Загрузка...';

        try {
            const response = await fetch(`https://v3.football.api-sports.io/teams?search=${encodeURIComponent(team)}`, {
                headers: { 'x-apisports-key': API_KEY }
            });

            const data = await response.json();
            
            if (data.response && data.response.length > 0) {
                result.textContent = '✅ Найдено:\n' + JSON.stringify(data.response, null, 2);
            } else {
                result.textContent = '❌ Команда не найдена.\nОтвет API: ' + JSON.stringify(data, null, 2);
            }
        } catch (error) {
            result.textContent = '❌ Ошибка: ' + error.message;
        }
    }
    </script>
</body>
</html>
